<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/people.css">

    <link rel="stylesheet" href="../../assets/css/global-lock-ui.css">
    <!-- RTL styles for Arabic (disabled by default, enabled by i18n.js) -->

<body class="system-page glossary-page regulation-page" data-submenu="regulatory">
<header class="header"></header>

<div class="page-header">
    <div class="page-header-container">
        <div class="page-title">
            <div class="page-icon"><i class="fas fa-balance-scale"></i></div>
            <div class="page-title-text">
                <div class="page-title-main" id="glossaryTitle"></div>
                <div class="page-title-sub" id="glossaryBreadcrumb" data-i18n="regulation.page.title">Regulation</div>
            </div>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="backBtn" data-i18n="button.back">Back</button>
        </div>
    </div>
</div>

<main class="main-content">
    <div class="content-card">
        <div class="content-header">
            <div class="tab-container">
                <button class="tab active" data-tab="summary" data-i18n="regulation.tabs.summary">SUMMARY</button>
                <button class="tab" data-tab="components" data-i18n="regulation.tabs.components">COMPONENTS</button>
                <button class="tab" data-tab="relationships" data-i18n="regulation.tabs.relationships">RELATIONSHIPS</button>
                <button class="tab" data-tab="stakeholders" data-i18n="tab.stakeholders">STAKEHOLDERS</button>
                <button class="tab" data-tab="impact" data-i18n="regulation.tabs.impact">IMPACT</button>
                <button class="tab" data-tab="history" data-i18n="regulation.tabs.history">HISTORY</button>
                <button class="tab" data-tab="change" data-i18n="regulation.tabs.change">CHANGE</button>
            </div>
            <div class="tab-actions">
                <!-- Edit dropdown will be inserted here by JavaScript -->
            </div>
        </div>
        <div class="content-body">
            <div id="glossaryViewContainer" class="view-grid"></div>
        </div>
    </div>
</main>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api-service.js"></script>
<script src="../../assets/js/view-lock-helper.js"></script>
<script src="../../assets/js/main.js"></script>
<script src="../../assets/js/initSearch.js"></script>
<script src="../../assets/js/edit-dropdown.js"></script>
<script src="../../assets/js/delete-handler.js"></script>

<script src="../../view/workflow-view.js"></script>
<script src="../../view/change-tab-component.js"></script>
<script src="../../assets/js/follow-modal.js"></script>
<script src="../../assets/js/follow-button.js"></script>
<script src="../../assets/js/custom-fields.js"></script>
<script src="../../view/regulation/regulation.js"></script>
