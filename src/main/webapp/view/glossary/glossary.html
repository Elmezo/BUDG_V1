<header class="header"></header>
<div class="page-header">

        <div class="page-title">
            <div class="page-icon"><i class="fas fa-book"></i></div>
            <div class="page-title-text">
                <div class="page-title-main" id="glossaryTitle">Name</div>

            </div>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="backBtn" data-i18n="button.back">Back</button>
        </div>
    </div>
</div>

<main class="main-content">

                <button class="tab active" data-tab="summary" data-i18n="tab.summary">SUMMARY</button>

                <button class="tab" data-tab="history" data-i18n="tab.history">HISTORY</button>
                <button class="tab" data-tab="change" data-i18n="tab.change">CHANGE</button>
            </div>
            <div class="tab-actions">
                <!-- Edit dropdown will be inserted here by JavaScript -->
            </div>
        </div>
        <div class="content-body">
            <div id="glossaryViewContainer"></div>
        </div>
    </div>
</main>
