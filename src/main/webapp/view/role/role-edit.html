<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - Edit Role</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../view/view.css">
    <link rel="stylesheet" href="../../assets/css/custom-fields.css">
    <link rel="stylesheet" href="../../assets/css/global-lock-ui.css">
    <link rel="stylesheet" href="../../assets/css/advanced-rich-text-editor.css">
    <!-- RTL styles for Arabic (disabled by default, enabled by i18n.js) -->
    <link rel="stylesheet" href="../../assets/css/rtl.css" id="rtl-styles" disabled>
    <script>(function(){const t=localStorage.getItem('budg-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <style>
        body.role-edit-page { overflow: hidden; height: 100vh; }
        .page-title { display: flex; align-items: center; gap: .75rem; }
        .page-icon { width: 32px; height: 32px; background: #248567; color: #fff; border-radius: 6px; display:flex; align-items:center; justify-content:center; }
        .page-title-text { display:flex; flex-direction:column; }
        .page-title-main { font-weight:600; color: var(--text-primary); }
        .page-title-sub { font-size:.8rem; color: var(--text-secondary); }
        .main-content { max-width: 1200px; margin: 0 auto; padding: 1rem 20px; height: calc(100vh - 70px - 80px); display:flex; flex-direction:column; overflow:hidden; }
        .content-card { background: var(--background-primary); border:1px solid var(--border-color); border-radius:8px; box-shadow: var(--shadow-light); flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .content-body { padding:1.5rem; flex:1; overflow:auto; }
    </style>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="../../assets/i18n/i18n.js"></script>
</head>
<body class="role-edit-page" data-submenu="organizational">
<header class="header"></header>

<div class="page-header">
    <div class="page-header-container">
        <div class="page-title">
            <div class="page-icon"><i class="fas fa-user-shield"></i></div>
            <div class="page-title-text">
                <div class="page-title-main">Edit Role</div>
                <div class="page-title-sub">Organizational</div>
            </div>
        </div>
        <div class="form-actions" id="editActionsBar">
            <button type="button" class="btn btn-primary" id="editSaveBtn">Save</button>
            <button type="button" class="btn btn-primary" id="editSaveCloseBtn">Save & Close</button>
            <button type="button" class="btn btn-secondary" id="editCancelBtn">Cancel</button>
        </div>
    </div>
</div>

<main class="main-content">
    <div class="content-card">
        <div class="content-body">
            <div id="roleEditContainer" class="view-grid">
                <div class="view-section" style="grid-column:1/-1;">
                    <form id="roleEditForm">
                        <div class="form-grid">
                            <div class="form-section">
                                <h3 class="section-title definition">ROLE INFORMATION</h3>
                                <div class="form-group">
                                    <label class="form-label">Name <span class="required">*</span></label>
                                    <input type="text" class="form-input" id="roleName" placeholder="Enter role name">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-input form-textarea" id="roleDescription" placeholder="Enter description"></textarea>
                                    <button type="button" class="btn btn-sm btn-outline editor-button" id="showEditorBtn">Show Editor</button>
                                </div>
                            </div>
                            
                            <!-- Custom Fields Section -->
                            <!-- Segment Field Container -->
                            <div id="segmentFieldContainer" style="grid-column: 1/-1; margin-top: 1rem;"></div>
                            
                            <div class="form-section" style="grid-column: 1/-1; margin-top: 2rem;">
                                <h3 class="section-title">CUSTOM FIELDS</h3>
                                <div id="customFieldsContainer"></div>
                            </div>
          
                        </div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
</main>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/api-service.js"></script>
    <script src="../../assets/js/save-error-helper.js"></script>
    <script src="../../assets/js/lock-manager.js"></script>
    <script src="../../assets/js/lock-init-helper.js"></script>
    <script src="../../assets/js/global-lock-ui.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/initSearch.js"></script>

    <script src="../../assets/js/custom-fields.js"></script>
    <script src="../../assets/js/segment-field.js"></script>
    <script src="../../assets/js/advanced-rich-text-editor.js"></script>
    <script src="../../view/role/role-edit.js"></script>
    <script src="../../assets/js/header.js"></script>
</body>
</html>
