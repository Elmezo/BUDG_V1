<body class="capability-page" data-submenu="business">
<header class="header"></header>

<div class="page-header">
    <div class="page-header-container">
        <div class="page-title">
            <div class="page-icon"><i class="fas fa-puzzle-piece"></i></div>
            <div class="page-title-text">
                <div class="page-title-main" id="capabilityTitle">Capability View</div>
                <div class="page-title-sub" id="capabilityBreadcrumb">Capability</div>
            </div>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="backBtn" data-i18n="button.back">Back</button>
            
        </div>
    </div>
</div>

<main class="main-content">
    <div class="content-card">
        <div class="content-header">
            <div class="tab-container">
                <button class="tab active" data-tab="summary" data-i18n="tab.summary">SUMMARY</button>
                <button class="tab" data-tab="relationships" data-i18n="tab.relationships">RELATIONSHIPS</button>
                <button class="tab" data-tab="stakeholders" data-i18n="tab.stakeholders">STAKEHOLDERS</button>
                <button class="tab" data-tab="impact" data-i18n="tab.impact">IMPACT</button>
                <button class="tab" data-tab="history" data-i18n="tab.history">HISTORY</button>
                <button class="tab" data-tab="change" data-i18n="tab.change">CHANGE</button>
            </div>
            <div class="tab-actions">
                <!-- Edit dropdown will be inserted here by JavaScript -->
            </div>
        </div>
        <div class="content-body">
            <div id="capabilityViewContainer" class="view-grid">
                <!-- Summary content will be loaded here by JavaScript -->
                
            </div>
            <div id="capabilityRelationshipsContainer" class="view-grid" style="display:none;"></div>
            <div id="capabilityStakeholdersContainer" class="view-grid" style="display:none;"></div>
            <div id="capabilityImpactContainer" class="view-grid" style="display:none;"></div>
            <div id="capabilityHistoryContainer" class="view-grid" style="display:none;"></div>
            <div id="capabilityChangeContainer" class="view-grid" style="display:none;"></div>
        </div>
    </div>
</main>

    <link rel="stylesheet" href="../../assets/js/libs/bpmn-js/assets/diagram-js.css">
