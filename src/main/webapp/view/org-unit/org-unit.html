<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - Org Unit View</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../view/view.css">
    <link rel="stylesheet" href="../../assets/css/org-unit.css">
    <link rel="stylesheet" href="../../assets/css/follow-modal.css">
    <link rel="stylesheet" href="../../assets/css/custom-fields.css">
    <link rel="stylesheet" href="../../assets/css/edit-dropdown.css">
    <link rel="stylesheet" href="../../assets/css/global-lock-ui.css">
    <!-- RTL styles for Arabic (disabled by default, enabled by i18n.js) -->
    <link rel="stylesheet" href="../../assets/css/rtl.css" id="rtl-styles" disabled>

    <link rel="stylesheet" href="../../view/history.css">
    <script>(function(){const t=localStorage.getItem('budg-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="../../assets/i18n/i18n.js"></script>
</head>
<body class="org-unit-page" data-submenu="organizational">
<header class="header"></header>

<div class="page-header">
    <div class="page-header-container">
        <div class="page-title">
            <div class="page-icon"><i class="fas fa-building"></i></div>
            <div class="page-title-text">
                <div class="page-title-main" id="orgUnitDisplayName" data-i18n="orgUnit.pageTitle">Org Unit</div>
                <div class="page-title-sub" data-i18n="orgUnit.pageSubtitle">Organizational</div>
            </div>
        </div>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="backBtn" data-i18n="button.back">Back</button>
        </div>
    </div>
</div>

<main class="main-content">
    <div class="content-card">
        <div class="content-header">
            <div class="tab-container">
                <button class="tab active" data-tab="summary" data-i18n="orgUnit.tabs.summary">SUMMARY</button>
                <button class="tab" data-tab="components" data-i18n="orgUnit.tabs.components">COMPONENTS</button>
                <button class="tab" data-tab="people" data-i18n="orgUnit.tabs.people">PEOPLE</button>
                <button class="tab" data-tab="history" data-i18n="orgUnit.tabs.history">HISTORY</button>
            </div>
            <div class="tab-actions">
                <!-- Edit dropdown will be inserted here by JavaScript -->
            </div>
        </div>
        <div class="content-body">
            <div id="orgUnitViewContainer" class="view-grid"></div>
            <div id="orgUnitComponentsContainer" class="view-grid" style="display:none;"></div>
            <div id="orgUnitPeopleContainer" class="view-grid" style="display:none;"></div>
            <div id="orgUnitHistoryContainer" class="view-grid" style="display:none;"></div>
        </div>
    </div>
</main>

<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api-service.js"></script>
<script src="../../assets/js/view-lock-helper.js"></script>
<script src="../../assets/js/main.js"></script>
<script src="../../assets/js/initSearch.js"></script>

    <script src="../../view/history-component.js"></script>
    <script src="../../assets/js/custom-fields.js"></script>
    <script src="../../assets/js/follow-modal.js"></script>
    <script src="../../assets/js/follow-button.js"></script>
    <script src="../../assets/js/edit-dropdown.js"></script>
    <script src="../../assets/js/delete-handler.js"></script>
    <script src="../../view/org-unit/org-unit.js"></script>
<script src="../../assets/js/header.js"></script>
<script src="../../assets/js/global-lock-ui.js"></script>
</body>
</html>
