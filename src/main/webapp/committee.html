<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - New Committee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/people.css">
    
    <link rel="stylesheet" href="assets/css/committee.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* Enhanced title styling for better visual hierarchy */
        .page-title-main {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            color: var(--text-primary) !important;
            margin-bottom: 0.25rem;
        }
        
        .page-title-sub {
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            color: var(--text-secondary) !important;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="committee-page" data-submenu="business">
    <header class="header"></header>

    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newCommittee">New Committee</div>
                    <div class="page-title-sub" data-i18n="facet.committee">Committee</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="closeBtn" data-i18n="button.close">Close</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active" data-i18n="tab.details">DETAILS</button>
                </div>
            </div>
            <div class="content-body">
                <form id="committeeForm">
                    <!-- Committee Container with Two-Column Grid -->
                    <div class="committee-container grid grid-cols-2 gap-6">
                        <!-- Left Column: Definition and Optional Fields -->
                        <div class="left-column">
                            <!-- DEFINITION Card -->
                            <div class="form-section">
                                <h3 class="section-title definition" data-i18n="createPage.section.definition">DEFINITION</h3>
                                
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.primaryName">Primary Name</span> <span class="required">*</span></label>
                                        <input type="text" class="form-input" id="primaryName" data-i18n-placeholder="createPage.placeholder.enterPrimaryName" placeholder="Enter Primary Name">
                                        <span class="field-error" id="primaryNameError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.parent">Parent</label>
                                        <select class="form-select" id="parent">
                                            <option value="" data-i18n="createPage.placeholder.selectParentCommittee">Select Parent Committee</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.ref">Ref.</label>
                                        <input type="text" class="form-input" id="ref" data-i18n-placeholder="createPage.placeholder.autoGenerated" placeholder="Auto-generated if left empty">
                                    </div>

                                    <div class="form-group full-width">
                                        <label class="form-label"><span data-i18n="createPage.label.description">Description</span> <span class="required">*</span></label>
                                        <textarea class="form-input form-textarea" id="description" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter Description"></textarea>
                                        <button type="button" class="editor-button" data-i18n="button.showEditor">Show Editor</button>
                                        <span class="field-error" id="descriptionError" style="display:none"></span>
                                    </div>
                                </div>
                            </div>
                             <!-- Custom Fields Section -->
                             <div class="form-section" style="grid-column: 1/-1;">
                                <h3 class="section-title" data-i18n="createPage.section.customFields">CUSTOM FIELDS</h3>
                                <div class="form-fields-container">
                                    <div id="customFieldsContainer"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Classifications -->
                        <div class="right-column">
                            <!-- CLASSIFICATIONS Card -->
                            <div class="form-section">
                                <h3 class="section-title classifications" data-i18n="createPage.section.classifications">CLASSIFICATIONS</h3>
                                
                                <div class="form-fields-container classifications-vertical">
                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.budgStatus">BUDG Status</span> <span class="required">*</span></label>
                                        <select class="form-select" id="budgStatus">
                                            <option value="" data-i18n="createPage.message.loading">Loading...</option>
                                        </select>
                                        <span class="field-error" id="budgStatusError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.budgViewing">BUDG Viewing</span> <span class="required">*</span></label>
                                        <select class="form-select" id="budgViewing">
                                            <option value="" data-i18n="createPage.message.loading">Loading...</option>
                                        </select>
                                        <span class="field-error" id="budgViewingError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.lifecycle">Lifecycle</span> <span class="required">*</span></label>
                                        <select class="form-select" id="lifecycle">
                                            <option value="" data-i18n="createPage.message.loading">Loading...</option>
                                        </select>
                                        <span class="field-error" id="lifecycleError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.classification">Classification</span> <span class="required">*</span></label>
                                        <select class="form-select" id="classification">
                                            <option value="" data-i18n="createPage.message.loading">Loading...</option>
                                        </select>
                                        <span class="field-error" id="classificationError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.committeeType">Committee Type</span> <span class="required">*</span></label>
                                        <select class="form-select" id="committeeType">
                                            <option value="" data-i18n="createPage.message.loading">Loading...</option>
                                        </select>
                                        <span class="field-error" id="committeeTypeError" style="display:none"></span>
                                    </div>

                                    <!-- Segment Field -->
                                    <div id="segmentFieldContainer" style="grid-column: 1/-1;"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/admin-panel/admin-notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>
    <script src="assets/js/global-lock-ui.js"></script>

    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/segment-field.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/committee.js"></script>
    <script src="assets/js/header.js"></script>
</body>
</html>
