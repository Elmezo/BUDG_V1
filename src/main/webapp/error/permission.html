<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Denied - BUDG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #248567; --bg: #f8f9fa; --text: #2c3e50; --muted:#6c757d; }
        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); }
        .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { background:#fff; border:1px solid #e9ecef; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.08); max-width:720px; width:100%; padding:36px; text-align:center; }
        .icon { width:84px; height:84px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin-bottom:18px; background:linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%); color:#fff; font-size:34px; box-shadow:0 8px 20px rgba(255, 107, 107,.35); }
        h1 { font-size:28px; margin:6px 0 8px; font-weight:700; letter-spacing:-.02em; }
        p { margin:0 auto 18px; max-width:560px; color:var(--muted); }
        .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
        .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:10px; border:1px solid #e9ecef; background:#fff; color:var(--text); text-decoration:none; font-weight:600; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
        .btn:hover { transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.08); }
        .btn-primary { background:var(--primary); color:#fff; border-color:transparent; }
        .btn-primary:hover { box-shadow:0 10px 22px rgba(36,133,103,.35); }
        .hint { margin-top:14px; font-size:13px; color:#8a94a6; }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script>
        function goHome(){ window.location.href = '/index.html'; }
        function goSearch(){ window.location.href = '/search.html'; }
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:,">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com data:; img-src 'self' data: https://*;">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="../assets/i18n/i18n.js"></script>
</head>
<body>
    <header class="header"></header>
    <div class="wrap">
        <div class="card">
            <div class="icon"><i class="fas fa-lock"></i></div>
            <h1>Permission Denied</h1>
            <p>You do not have the required permissions to view this page.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/index.html"><i class="fas fa-home"></i> Back to Homepage</a>
                <a class="btn" href="/search.html"><i class="fas fa-search"></i> Search page</a>
            </div>
            <div class="hint">If you believe this is a mistake, please sign in and try again.</div>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/header.js"></script>
</body>
<!-- Keep file lightweight; no external app scripts -->
</html>
