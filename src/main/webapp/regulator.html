<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - New Regulator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/people.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/policy.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* Enhanced title styling for better visual hierarchy */
        .page-title-main {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            color: var(--text-primary) !important;
            margin-bottom: 0.25rem;
        }
        
        .page-title-sub {
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            color: var(--text-secondary) !important;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="regulator-page" data-submenu="regulatory">
    <header class="header"></header>

    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-landmark"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newRegulator">New Regulator</div>
                    <div class="page-title-sub" data-i18n="facet.regulator">Regulator</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="closeBtn" data-i18n="button.close">Close</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active" data-i18n="tab.details">DETAILS</button>
                </div>
            </div>
            <div class="content-body">
                <form id="regulatorForm">
                    <!-- Regulator Container with Two-Column Grid -->
                    <div class="policy-container grid grid-cols-2 gap-6">
                        <!-- Left Column: Definition -->
                        <div class="left-column">
                            <!-- DEFINITION Card -->
                            <div class="form-section">
                                <h3 class="section-title definition">DEFINITION</h3>
                                
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label">Name <span class="required">*</span></label>
                                        <input type="text" class="form-input" id="name" placeholder="Enter Name">
                                        <span class="field-error" id="nameError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label">Short Name <span class="required">*</span></label>
                                        <input type="text" class="form-input" id="shortName" placeholder="Enter Short Name">
                                        <span class="field-error" id="shortNameError" style="display:none"></span>
                                    </div>

                                    <div class="form-group full-width">
                                        <label class="form-label">Description <span class="required">*</span></label>
                                        <textarea class="form-input form-textarea" id="description" placeholder="Enter Description"></textarea>
                                        <button type="button" class="editor-button" id="showDescriptionEditorBtn">Show Editor</button>
                                        <span class="field-error" id="descriptionError" style="display:none"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Classifications (Other Information) -->
                        <div class="right-column">
                            <div class="form-section">
                                <h3 class="section-title classifications">CLASSIFICATIONS</h3>

                                <div class="form-fields-container classifications-vertical">
                                    <div class="form-group">
                                        <label class="form-label" style="font-weight:600; color:var(--text-secondary);">OTHER INFORMATION</label>
                                    </div>
                                    <!-- Segment Field -->
                                    <div id="segmentFieldContainer" style="grid-column: 1/-1; margin-top: 1rem;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Custom Fields Section -->
                    <div class="form-section" style="grid-column: 1/-1; margin-top: 2rem;">
                        <h3 class="section-title">CUSTOM FIELDS</h3>
                        <div id="customFieldsContainer"></div>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>
    
    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/segment-field.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/regulator.js"></script>
    <script src="assets/js/header.js"></script>
</body>
</html>
