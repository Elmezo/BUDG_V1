<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - New Policy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/people.css">
    
    <link rel="stylesheet" href="assets/css/policy.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* Enhanced title styling for better visual hierarchy */
        .page-title-main {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            color: var(--text-primary) !important;
            margin-bottom: 0.25rem;
        }
        
        .page-title-sub {
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            color: var(--text-secondary) !important;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Searchable Dropdown Styles */
        .searchable-dropdown-container {
            position: relative;
            width: 100%;
        }

        .searchable-dropdown {
            position: relative;
            width: 100%;
        }

        .searchable-dropdown input[type="text"] {
            width: 100%;
            padding: 0.75rem 2.5rem 0.75rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            background-color: white;
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            opacity: 1;
        }

        .searchable-dropdown input[type="text"]:focus {
            outline: none;
            border-color: #248567;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }

        .searchable-dropdown input[type="text"]:hover {
            background: white;
            border-color: #d1d5db;
        }

        .searchable-dropdown-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.2s ease;
        }

        .searchable-dropdown-toggle:hover {
            color: #248567;
        }

        .searchable-dropdown.open .searchable-dropdown-toggle i {
            transform: rotate(180deg);
        }

        .ref-policy-picker-row {
            position: relative;
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
        }
        .ref-policy-picker-row .form-input {
            flex: 1;
            cursor: default;
        }
        .ref-policy-picker-actions {
            display: flex;
            gap: 0.35rem;
            align-items: center;
        }

        .searchable-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            opacity: 1;
        }

        .searchable-dropdown-search {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .searchable-dropdown-search input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
            background-color: white;
            color: var(--text-primary);
            font-size: 0.875rem;
            opacity: 1;
        }

        .searchable-dropdown-search input:focus {
            outline: none;
            border-color: #248567;
        }

        .searchable-dropdown-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .searchable-dropdown-item {
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            transition: background-color 0.2s ease;
            background-color: white;
            opacity: 1;
        }

        .searchable-dropdown-item:last-child {
            border-bottom: none;
        }

        .searchable-dropdown-item:hover {
            background-color: #f3f4f6;
            opacity: 1;
        }

        .searchable-dropdown-item-name {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .searchable-dropdown-item-description {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Checkbox styles */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-container input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #248567;
        }
    </style>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="policy-page" data-submenu="business">
    <header class="header"></header>

    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newPolicy">New Policy</div>
                    <div class="page-title-sub" data-i18n="facet.policy">Policy</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="closeBtn" data-i18n="button.close">Close</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active" data-i18n="tab.details">DETAILS</button>
                </div>
            </div>
            <div class="content-body">
                <form id="policyForm">
                    <!-- Policy Container with Two-Column Grid -->
                    <div class="policy-container grid grid-cols-2 gap-6">
                        <!-- Left Column: Definition and Optional Fields -->
                        <div class="left-column">
                            <!-- DEFINITION Card -->
                            <div class="form-section">
                                <h3 class="section-title definition" data-i18n="createPage.section.definition">DEFINITION</h3>
                                
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.name">Name</span> <span class="required">*</span></label>
                                        <input type="text" class="form-input" id="name" data-i18n-placeholder="createPage.placeholder.enterName" placeholder="Enter Name">
                                        <span class="field-error" id="nameError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.parentPolicy">Parent Name</label>
                                        <div class="searchable-dropdown-container">
                                            <div class="searchable-dropdown">
                                                <input type="text" class="form-input" id="parentName" data-i18n-placeholder="createPage.placeholder.selectParentPolicy" placeholder="Parent Name" readonly>
                                                <input type="hidden" id="parentId" value="">
                                                <div class="searchable-dropdown-toggle" id="parentDropdownToggle">
                                                    <i class="fas fa-edit"></i>
                                                </div>
                                                <div class="searchable-dropdown-menu" id="parentDropdownMenu" style="display: none;">
                                                    <div class="searchable-dropdown-search">
                                                        <input type="text" id="parentSearchInput" data-i18n-placeholder="placeholder.search" placeholder="Search policies...">
                                                    </div>
                                                    <div class="searchable-dropdown-list" id="parentDropdownList"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.ref">Ref.</label>
                                        <input type="text" class="form-input" id="ref" data-i18n-placeholder="createPage.placeholder.enterRef" placeholder="Enter Reference">
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.type">Type</span> <span class="required">*</span></label>
                                        <select class="form-select" id="type">
                                            <option value="" data-i18n="createPage.placeholder.selectType">Please select</option>
                                            <option value="1">Conduct Standards</option>
                                            <option value="2">Security Policy</option>
                                            <option value="3">Data Protection</option>
                                            <option value="4">Access Control</option>
                                            <option value="5">Compliance</option>
                                        </select>
                                        <span class="field-error" id="typeError" style="display:none"></span>
                                    </div>

                                    <div class="form-group full-width">
                                        <label class="form-label"><span data-i18n="createPage.label.description">Description</span> <span class="required">*</span></label>
                                        <textarea class="form-input form-textarea" id="description" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter Description"></textarea>
                                        <button type="button" class="editor-button" data-i18n="button.showEditor">Show Editor</button>
                                        <span class="field-error" id="descriptionError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <div class="checkbox-container">
                                            <input type="checkbox" id="internal" checked>
                                            <label class="form-label"><span data-i18n="createPage.label.internal">Internal</span> <span class="required">*</span></label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- OPTIONAL FIELDS Card -->
                            <div class="form-section">
                                <h4 class="section-title optional-fields" data-i18n="createPage.section.optionalFields">OPTIONAL FIELDS</h4>
                                
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.url">URL</label>
                                        <input type="url" class="form-input" id="url" data-i18n-placeholder="createPage.placeholder.enterUrl" placeholder="Enter URL">
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="securityClassificationRefDisplay">Security or Classification Policy Reference</label>
                                        <div class="ref-policy-picker-row">
                                            <input type="text" class="form-input" id="securityClassificationRefDisplay" readonly placeholder="Choose Security or Classification Policy Reference">
                                            <input type="hidden" id="securityClassificationRefPolicyId" value="">
                                            <div class="ref-policy-picker-actions">
                                                <button type="button" class="btn btn-sm btn-outline-secondary" id="securityClassificationRefClear" title="Clear" aria-label="Clear selection">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                                <button type="button" class="btn btn-sm btn-secondary" id="securityClassificationRefOpen" title="Select" aria-label="Select policy">
                                                    <i class="fas fa-pencil-alt"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Classifications -->
                        <div class="right-column">
                            <!-- CLASSIFICATIONS Card -->
                            <div class="form-section">
                                <h3 class="section-title classifications" data-i18n="createPage.section.classifications">CLASSIFICATIONS</h3>
                                
                                <div class="form-fields-container classifications-vertical">
                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.effectiveDate">Effective Date</label>
                                        <input type="date" class="form-input" id="effectiveDate" data-i18n-placeholder="createPage.placeholder.selectEffectiveDate" placeholder="Select a date">
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" data-i18n="createPage.label.endDate">End Date</label>
                                        <input type="date" class="form-input" id="endDate" data-i18n-placeholder="createPage.placeholder.selectEndDate" placeholder="Select a date">
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.budgStatus">BUDG Status</span> <span class="required">*</span></label>
                                        <select class="form-select" id="BUDGStatus">
                                            <option value="" data-i18n="createPage.placeholder.selectStatus">Please select</option>
                                            <option value="1">Active</option>
                                            <option value="2">Inactive</option>
                                            <option value="3">Draft</option>
                                            <option value="4">Under Review</option>
                                            <option value="5">Expired</option>
                                        </select>
                                        <span class="field-error" id="BUDGStatusError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.lifecycle">Lifecycle</span> <span class="required">*</span></label>
                                        <select class="form-select" id="lifecycle">
                                            <option value="" data-i18n="createPage.placeholder.selectLifecycle">Please select</option>
                                            <option value="1">Draft</option>
                                            <option value="2">Review</option>
                                            <option value="3">Approved</option>
                                            <option value="4">Published</option>
                                            <option value="5">Archived</option>
                                        </select>
                                        <span class="field-error" id="lifecycleError" style="display:none"></span>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label"><span data-i18n="createPage.label.budgViewing">BUDG Viewing</span> <span class="required">*</span></label>
                                        <select class="form-select" id="BUDGViewing">
                                            <option value="" data-i18n="createPage.placeholder.selectViewing">Please select</option>
                                            <option value="1">Public</option>
                                            <option value="2">Private</option>
                                            <option value="3">Restricted</option>
                                            <option value="4">Confidential</option>
                                            <option value="5">Internal</option>
                                        </select>
                                        <span class="field-error" id="BUDGViewingError" style="display:none"></span>
                                    </div>

                                    <!-- Segment Field -->
                                    <div id="segmentFieldContainer" style="margin-top: 1rem;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Custom Fields Section -->
                    
                    <div class="form-section" id="customFieldsSection">
                        <h3 class="section-title" data-i18n="createPage.section.customFields">CUSTOM FIELDS</h3>
                        <div id="customFieldsContainer"></div>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/admin-panel/admin-notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>

    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/segment-field.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/policy.js"></script>
    <script src="assets/js/header.js"></script>
</body>
</html>
