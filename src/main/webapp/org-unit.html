<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - Org Unit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/org-unit.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    
    <script>
        // Apply theme immediately to prevent flash of unstyled content
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="org-unit-page">
    <!-- Header Navigation -->
    <header class="header"></header>

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-sitemap"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newOrgUnit">New Org Unit</div>
                    <div class="page-title-sub" data-i18n="facet.orgUnit">Org Unit</div>
                </div>
            </div>
                            <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn" data-i18n="button.close">Close</button>
                    <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                    <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
                </div>

        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active">DETAILS</button>
                </div>
            </div>
            <div class="content-body">
                <form id="orgUnitForm">
                    <div class="org-unit-container grid grid-cols-2 gap-6">
                        <!-- Left Column - Definition -->
                        <div class="left-column">
                            <div class="form-section">
                                <h4 class="section-title">DEFINITION</h4>
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label">
                                            Primary Name
                                            <span class="required">*</span>
                                        </label>
                                        <input type="text" class="form-input" id="nameInput" placeholder="Enter Name">
                                    </div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">Parent</label>
                                        <div class="form-input-group" style="position: relative;">
                                            <input type="text" class="form-input" id="parentInput" placeholder="Parent" readonly>
                                            <i class="fas fa-edit input-icon" id="parentEditBtn"></i>
                                            
                                            <!-- Parent Selection Dropdown -->
                                            <div class="modal-overlay" id="parentModal">
                                                <div class="modal">
                                                    <div class="modal-header">
                                                        <div class="modal-title">Current selection: <span id="currentSelection">None</span></div>
                                                        <button class="modal-close" id="modalClose">
                                                            <i class="fas fa-times"></i>
                                                        </button>
                                                    </div>
                                                    <div class="modal-body">
                                                        <div class="modal-search">
                                                            <div class="search-input-container">
                                                                <input type="text" class="modal-search-input" id="searchInput" placeholder="Search by name or description...">
                                                                <button type="button" class="search-clear-btn" id="searchClearBtn" title="Clear search">
                                                                    <i class="fas fa-times"></i>
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <div class="modal-table-container">
                                                            <table class="modal-table">
                                                                <thead>
                                                                    <tr>
                                                                        <th>Name</th>
                                                                        <th>Description</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody id="tableBody">
                                                                    <!-- Table data will be populated dynamically from API -->
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button type="button" class="btn btn-secondary" id="modalCloseBtn">Close</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="form-group">
                                        <label class="form-label">
                                            Ref.
                                            <span class="required">*</span>
                                        </label>
                                        <input type="text" class="form-input" id="referenceInput" placeholder="Enter Reference">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-section">
                                <h4 class="section-title">OPTIONAL FIELDS</h4>
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-input form-textarea" id="descriptionInput" placeholder="Enter Description"></textarea>
                                        <button type="button" class="editor-button" id="showDescriptionEditorBtn">Show Editor</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Right Column - Classifications -->
                        <div class="right-column">
                            <div class="form-section">
                                <h4 class="section-title">CLASSIFICATIONS</h4>
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label">
                                            BUDG Status
                                            <span class="required">*</span>
                                        </label>
                                        <select class="form-select" id="statusSelect">
                                            <option value="">Loading statuses...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Custom Fields Section -->
                            <div class="form-section" style="grid-column: 1/-1; margin-top: 2rem;">
                                <h3 class="section-title">CUSTOM FIELDS</h3>
                                <div id="customFieldsContainer"></div>
                            </div>
                        </div>
                    </div>
                </form>
                

            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/admin-panel/admin-notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>

    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/org-unit.js"></script>
    <script src="assets/js/header.js"></script>

</body>
</html>
