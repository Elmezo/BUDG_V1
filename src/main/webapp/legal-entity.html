<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - Legal Entity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/legal-entity.css">
    <link rel="stylesheet" href="assets/css/committee.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .page-title-main {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            color: var(--text-primary) !important;
            margin-bottom: 0.25rem;
        }
        .page-title-sub {
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            color: var(--text-secondary) !important;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="legal-entity-page" data-submenu="business">
    <header class="header"></header>

    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newLegalEntity">New Legal Entity</div>
                    <div class="page-title-sub" data-i18n="facet.legalEntity">Legal Entity</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn" data-i18n="button.close">Close</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active" data-i18n="tab.details">DETAILS</button>
                </div>
            </div>
            <div class="content-body">
                <form id="legalEntityForm">
                    <div class="committee-container grid grid-cols-2 gap-6 legal-entity-create-grid">
                        <div class="left-column">
                            <div class="form-section">
                                <h3 class="section-title definition" data-i18n="createPage.section.definition">DEFINITION</h3>
                                <div class="form-fields-container">
                                    <div class="form-group">
                                        <label class="form-label">
                                            Long Name
                                            <span class="required">*</span>
                                        </label>
                                        <input type="text" class="form-input" id="nameInput" placeholder="Enter Long Name">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">
                                            Short Name
                                            <span class="required">*</span>
                                        </label>
                                        <input type="text" class="form-input" id="shortNameInput" placeholder="Enter Short Name">
                                    </div>
                                    <div class="form-group">
                                        <h4 class="section-title optional-fields">OPTIONAL FIELDS</h4>
                                        <label class="form-label">Parent Legal Entity</label>
                                        <select class="form-select" id="parentLegalEntitySelect">
                                            <option value="">Loading parent legal entities...</option>
                                        </select>
                                    </div>
                                    <div class="form-group full-width">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-input form-textarea" id="descriptionInput" placeholder="Enter Description"></textarea>
                                        <button type="button" class="editor-button" id="showDescriptionEditorBtn">Show Editor</button>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section" style="grid-column: 1/-1;">
                                <h3 class="section-title" data-i18n="createPage.section.customFields">CUSTOM FIELDS</h3>
                                <div class="form-fields-container">
                                    <div id="customFieldsContainer"></div>
                                </div>
                            </div>
                        </div>

                        <div class="right-column">
                            <div class="form-section">
                                <h3 class="section-title classifications" data-i18n="createPage.section.classifications">CLASSIFICATIONS</h3>
                                <div class="form-fields-container classifications-vertical">
                                    <div class="form-group">
                                        <h4 class="section-title">BASIC CLASSIFICATIONS</h4>
                                        <label class="form-label">
                                            BUDG Status
                                            <span class="required">*</span>
                                        </label>
                                        <select class="form-select" id="statusSelect">
                                            <option value="">Loading statuses...</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">
                                            BUDG Viewing
                                            <span class="required">*</span>
                                        </label>
                                        <select class="form-select" id="viewingSelect">
                                            <option value="">Loading viewing options...</option>
                                        </select>
                                    </div>
                                    <div id="segmentFieldContainer" style="grid-column: 1/-1;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/admin-panel/admin-notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>
    <script src="assets/js/global-lock-ui.js"></script>

    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/segment-field.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/legal-entity.js"></script>
    <script src="assets/js/header.js"></script>

</body>
</html>
