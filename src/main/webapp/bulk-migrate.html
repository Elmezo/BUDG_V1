<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Migrate - BUDG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/rtl.css" id="rtl-styles" disabled>
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    <style>
        /* Body spacing for fixed header (70px) */
        body {
            padding-top: 70px; /* Main header height */
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background-secondary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* Ensure header stays fixed and doesn't interfere */
        .header {
            position: fixed;
            z-index: 1000;
        }
        
        .bulk-migrate-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
        }

        /* Header */
        .bulk-migrate-header {
            position: fixed;
            top: 70px; /* Below main header */
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #248567;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 999;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-icon {
            font-size: 1.5rem;
            color: #ffffff;
            opacity: 0.9;
        }
        .header-title h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
        }
        .header-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            font-weight: 400;
        }
        .header-right {
            display: flex;
            gap: 8px;
        }

        /* Tab Navigation */
        .bulk-migrate-tabs {
            position: fixed;
            top: 118px; /* Below main header (70px) + bulk-migrate-header (48px) */
            left: 0;
            right: 0;
            display: flex;
            background: var(--background-primary);
            border-bottom: 2px solid var(--border-color);
            padding: 0 24px;
            z-index: 998;
        }
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: -2px;
        }
        .tab:hover {
            color: var(--primary-color);
        }
        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--primary-color);
        }

        /* Main Content */
        .bulk-migrate-main {
            padding: 24px;
            padding-top: 180px; /* Space for main header (70px) + bulk-migrate-header (48px) + tabs (62px) */
            background: var(--background-secondary);
            min-height: calc(100vh - 200px);
        }

        /* Cards */
        .card {
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-light);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .card-header {
            padding: 12px 20px;
            background: var(--background-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .card-body {
            padding: 0;
        }

        /* Selected Objects Table */
        .selected-objects-table {
            width: 100%;
            border-collapse: collapse;
        }
        .selected-objects-table thead {
            background: var(--background-secondary);
        }
        .selected-objects-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }
        .selected-objects-table td {
            padding: 12px 16px;
            font-size: 0.875rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .selected-objects-table tr:last-child td {
            border-bottom: none;
        }
        .selected-objects-table tr:hover {
            background: var(--background-hover);
        }
        .object-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .object-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        .object-name-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            position: relative;
        }
        .object-name-link:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        /* Card Actions */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .settings-btn:hover {
            background: var(--background-hover);
            border-color: var(--text-secondary);
        }
        .settings-btn i:first-child {
            font-size: 14px;
        }
        .settings-btn i:last-child {
            font-size: 10px;
        }

        /* Related Objects Grid */
        .related-objects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 20px;
        }
        .related-object-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .related-object-item:nth-child(odd) {
            border-right: 1px solid var(--border-color);
        }
        .related-object-item:last-child,
        .related-object-item:nth-last-child(2) {
            border-bottom: none;
        }
        .related-object-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        .related-object-label {
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            flex: 1;
        }
        .related-object-item.disabled {
            opacity: 0.6;
            background: var(--background-secondary);
        }
        .related-object-item.disabled .related-object-checkbox {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .related-object-item.disabled .related-object-label {
            cursor: not-allowed;
        }
        
        /* Dependent (mandatory) facets - BUDG rule */
        .related-object-item.dependent {
            background: rgba(36, 133, 103, 0.1);
            border-left: 3px solid var(--primary-color);
        }
        .related-object-item.dependent .related-object-label {
            font-weight: 600;
            color: var(--text-primary);
        }
        .related-object-item.dependent .related-object-checkbox {
            cursor: not-allowed;
        }

        /* Select All */
        .select-all-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .select-all-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
        .select-all-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }
        .btn-primary:disabled {
            background: var(--text-tertiary);
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-secondary {
            background: var(--text-secondary);
            color: white;
        }
        .btn-secondary:hover {
            background: var(--text-primary);
        }

        /* No Items Message */
        .no-items-message {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 40px;
            color: var(--text-secondary);
        }
        .no-items-message i {
            font-size: 18px;
        }

        /* Validation Messages */
        .validation-message {
            padding: 12px 20px;
            border-radius: 4px;
            margin: 20px 30px;
            display: none;
        }
        .validation-message.error {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--required-color);
            color: var(--required-color);
        }
        .validation-message.warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            color: #856404;
        }
        .validation-message.show {
            display: block;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Tooltip for facet name */
        .facet-tooltip {
            position: fixed;
            background: var(--text-primary);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            z-index: 10001;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            margin-top: 4px;
        }
        .facet-tooltip.visible {
            opacity: 1;
        }
        .facet-tooltip::after {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 10px;
            border: 5px solid transparent;
            border-bottom-color: var(--text-primary);
        }
        
        /* Ensure card and table don't clip tooltips */
        .card {
            overflow: visible;
        }
        .card-body {
            overflow: visible;
        }
        .selected-objects-table {
            overflow: visible;
        }
        .selected-objects-table td {
            overflow: visible;
        }
        .object-row {
            position: relative;
            overflow: visible;
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body>
    <!-- Main Application Header -->
    <header class="header"></header>

    <!-- Bulk Migrate Container -->
    <div class="bulk-migrate-container">
        <!-- Header -->
        <div class="bulk-migrate-header">
            <div class="header-left">
                <i class="fas fa-download header-icon"></i>
                <div class="header-title">
                    <h1 data-i18n="bulkMigrate.headerTitle">Bulk Migrate</h1>
                    <span class="header-subtitle" id="facetSubtitle" data-i18n="bulkMigrate.headerSubtitle">Data Migration</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="downloadBtn" disabled>
                    <i class="fas fa-download"></i> <span data-i18n="bulkMigrate.download">Download</span>
                </button>
                <button class="btn btn-secondary" id="closeBtn">
                    <i class="fas fa-times"></i> <span data-i18n="bulkMigrate.close">Close</span>
                </button>
            </div>
        </div>

        <!-- Tab Navigation -->
        <nav class="bulk-migrate-tabs">
            <button class="tab active" data-tab="summary" data-i18n="bulkMigrate.tabSummary">SUMMARY</button>
        </nav>

        <!-- Validation Messages -->
        <div class="validation-message error" id="errorMessage"></div>
        <div class="validation-message warning" id="warningMessage"></div>

        <!-- Main Content -->
        <main class="bulk-migrate-main">
            <!-- Summary Tab Content -->
            <section id="summary-tab" class="tab-content active">
                <!-- Migrate Selected Objects Card -->
                <div class="card selected-objects-card">
                    <div class="card-header">
                        <h2 data-i18n="bulkMigrate.cardMigrateTitle">MIGRATE SELECTED OBJECTS</h2>
                        <div class="card-actions">
                            <button class="settings-btn" id="settingsBtn" data-i18n-title="bulkMigrate.settingsTitle" title="Settings">
                                <i class="fas fa-cog"></i>
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <table class="selected-objects-table" id="selectedObjectsTable">
                            <thead>
                                <tr>
                                    <th data-i18n="bulkMigrate.tableName">Name</th>
                                </tr>
                            </thead>
                            <tbody id="selectedObjectsTableBody">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                        <div class="no-items-message" id="noSelectedObjectsMessage" style="display: none;">
                            <i class="fas fa-info-circle"></i>
                            <span data-i18n="bulkMigrate.noObjectsMessage">No objects selected for migration</span>
                        </div>
                    </div>
                </div>

                <!-- Include Related Objects Card -->
                <div class="card related-objects-card">
                    <div class="card-header">
                        <h2 data-i18n="bulkMigrate.cardRelatedTitle">INCLUDE RELATED OBJECTS</h2>
                        <div class="select-all-container">
                            <input type="checkbox" id="selectAllCheckbox" class="select-all-checkbox">
                            <label for="selectAllCheckbox" class="select-all-label" data-i18n="bulkMigrate.selectAll">SELECT ALL</label>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="related-objects-grid" id="relatedObjectsGrid">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/bulk-migrate.js"></script>

</body>
</html>
