<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - New Glossary Entry</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/glossary.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="glossary-page" data-submenu="data">
    <header class="header"></header>

    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-book"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newGlossary">New Glossary Entry</div>
                    <div class="page-title-sub" data-i18n="label.group.dataTechnology">Data & Technology</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="closeBtn" data-i18n="button.close">Close</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active" data-i18n="tab.summary">SUMMARY</button>
                </div>
            </div>
            <div class="content-body">
                <form id="glossaryForm">
                    <div class="glossary-container">
                        <!-- Left Column: Definition and Optional Fields -->
                        <div class="left-column">
                            <!-- Definition Section -->
                            <div class="form-section">
                                <h3 class="section-title" data-i18n="createPage.section.definition">DEFINITION</h3>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.name">Name</span> <span class="required">*</span></label>
                                    <input type="text" class="form-input" id="gloName" data-i18n-placeholder="createPage.placeholder.enterName" placeholder="Enter Name">
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="createPage.label.parentGlossary">Parent Name</label>
                                    <div class="input-group">
                                        <input type="text" class="form-input" id="gloParentName" data-i18n-placeholder="createPage.placeholder.selectParentGlossary" placeholder="Parent Name">
                                        <button type="button" class="input-icon" id="editParentBtn">
                                            <i class="fas fa-pencil-alt"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.definition">Definition</span> <span class="required">*</span></label>
                                    <textarea class="form-input form-textarea" id="gloDefinition" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter Definition"></textarea>
                                    <button type="button" class="editor-button" id="showDefinitionEditorBtn">Show Editor</button>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="createPage.label.ref">Ref.</label>
                                    <input type="text" class="form-input" id="gloRef" data-i18n-placeholder="createPage.placeholder.autoGenerated" placeholder="Auto-generated if empty (e.g., GL001)">
                                    <div class="form-hint">
                                        <span id="refHint" data-i18n="createPage.placeholder.autoGenerated">Enter Reference manually or auto-generate if empty</span>
                                        <span id="refPreview" class="ref-preview" style="display: none;"></span>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.formatType">Format Type</span> <span class="required">*</span></label>
                                    <select class="form-select" id="gloFormatType">
                                         
                                    </select>
                                </div>
                            </div>

                            <!-- Optional Fields Section -->
                            <div class="form-section">
                                <h3 class="section-title" data-i18n="createPage.section.optionalFields">OPTIONAL FIELDS</h3>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="createPage.label.aliases">Alias Names</label>
                                    <div class="tags-input" id="gloAliases" contenteditable="true" data-placeholder="Add Alias Names and press Enter"></div>
                                    <div class="form-hint">Type an alias and press Enter to add.</div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="label.formatDescription">Format Description</label>
                                    <input type="text" class="form-input" id="gloFormatDescription" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter Format Description">
                                    <div class="form-hint">
                                        <a href="#" class="show-editor-link" data-i18n="button.showEditor">Show Editor</a>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="label.ldmReference">LDM Reference</label>
                                    <input type="text" class="form-input" id="gloLdmRef" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter LDM Reference">
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="label.businessLogic">Business Logic</label>
                                    <textarea class="form-input form-textarea" id="gloBusinessLogic" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter Business Logic"></textarea>
                                    <button type="button" class="editor-button" id="showBusinessLogicEditorBtn">Show Editor</button>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="label.examples">Examples</label>
                                    <textarea class="form-input form-textarea" id="gloExamples" data-i18n-placeholder="createPage.placeholder.enterDescription" placeholder="Enter Examples"></textarea>
                                    <button type="button" class="editor-button" id="showExamplesEditorBtn">Show Editor</button>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Classifications and Other Information -->
                        <div class="right-column">
                            <!-- Classifications Section -->
                            <div class="form-section">
                                <h3 class="section-title" data-i18n="createPage.section.classifications">CLASSIFICATIONS</h3>

                                <div class="subsection-title" data-i18n="createPage.section.basicClassifications">BASIC CLASSIFICATIONS</div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.budgStatus">BUDG Status</span> <span class="required">*</span></label>
                                    <select class="form-select" id="gloStatus">
                                         
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.lifecycle">Lifecycle</span> <span class="required">*</span></label>
                                    <select class="form-select" id="gloLifecycle">
                                         
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.budgViewing">BUDG Viewing</span> <span class="required">*</span></label>
                                    <select class="form-select" id="gloViewing">
                                         
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.type">Type</span> <span class="required">*</span></label>
                                    <select class="form-select" id="gloType">
                                         
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label"><span data-i18n="createPage.label.securityClassification">Security Classification</span> <span class="required">*</span></label>
                                    <select class="form-select" id="gloSecurity">
                                         
                                    </select>
                                </div>

                                <!-- Segment Field -->
                                <div id="segmentFieldContainer" style="margin-top: 1rem;"></div>
                            </div>

                            <!-- Other Information Section -->
                            <div class="form-section">
                                <h3 class="section-title" data-i18n="createPage.section.otherInformation">OTHER INFORMATION</h3>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="label.ciaRating">CIA Rating</label>
                                    <div class="cia-rating">
                                        <div class="cia-item">
                                            <span class="cia-label">C</span>
                                            <select class="form-select" id="gloCiaC">
                                                <option value="">-</option>
                                            </select>
                                        </div>
                                        <div class="cia-item">
                                            <span class="cia-label">I</span>
                                            <select class="form-select" id="gloCiaI">
                                                <option value="">-</option>
                                            </select>
                                        </div>
                                        <div class="cia-item">
                                            <span class="cia-label">A</span>
                                            <select class="form-select" id="gloCiaA">
                                                <option value="">-</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" data-i18n="label.kde">KDE</label>
                                    <select class="form-select" id="gloKde">
                                        <option value=""></option>
                                         
                                    </select>
                                </div>
                            </div>
                            
                            <!-- Custom Fields Section -->
                            <div class="form-section" style="grid-column: 1/-1; margin-top: 2rem;">
                                <h3 class="section-title" data-i18n="createPage.section.customFields">CUSTOM FIELDS</h3>
                                <div id="customFieldsContainer"></div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/admin-panel/admin-notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>

    
    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/segment-field.js"></script>
    <script src="assets/js/dfcr-utils.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/glossary.js"></script>
    <script src="assets/js/header.js"></script>
</body>
</html>
