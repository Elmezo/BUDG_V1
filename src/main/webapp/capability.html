<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDG - New Capability</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/capability.css">
    <link rel="stylesheet" href="assets/css/custom-fields.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <link rel="stylesheet" href="assets/css/advanced-rich-text-editor.css">
    <link rel="icon" type="image/png" href="assets/images/avatars/icon.jpg">
    
    <script>
        // Apply theme immediately to prevent flash of unstyled content
        (function() {
            const savedTheme = localStorage.getItem('budg-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <script src="/assets/i18n/head-locale.js"></script>
    <script src="assets/i18n/i18n.js"></script>
</head>
<body class="capability-page" data-submenu="organizational">
    <!-- Header Navigation -->
    <header class="header"></header>

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-header-container">
            <div class="page-title">
                <div class="page-icon">
                    <i class="fas fa-tools"></i>
                </div>
                <div class="page-title-text">
                    <div class="page-title-main" data-i18n="createPage.title.newCapability">New Capability</div>
                    <div class="page-title-sub" data-i18n="facet.capability">Capability</div>
                </div>
            </div>
            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn" data-i18n="button.close">Close</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="button.save">Save</button>
                <button type="button" class="btn btn-success" id="saveAndCloseBtn" data-i18n="button.saveAndClose">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-card">
            <div class="content-header">
                <div class="tab-container">
                    <button class="tab active">SUMMARY</button>
                </div>
            </div>
            <div class="content-body">
                <form id="capabilityForm">
                    <div class="form-grid">
                        <!-- Left Panel - Definition -->
                        <div class="form-section">
                            <h3 class="section-title definition">DEFINITION</h3>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    Primary Name
                                    <span class="required">*</span>
                                </label>
                                <input type="text" class="form-input" id="primaryNameInput" placeholder="Enter Primary Name">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Parent</label>
                                <div class="form-input-group">
                                    <input type="text" class="form-input" id="parentInput" placeholder="Parent" readonly>
                                    <i class="fas fa-edit input-icon" id="parentEditBtn"></i>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Ref.</label>
                                <input type="text" class="form-input" id="referenceInput" placeholder="Enter Reference">
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    Description
                                    <span class="required">*</span>
                                </label>
                                <textarea class="form-input form-textarea" id="descriptionInput" placeholder="Enter Description"></textarea>
                                <button type="button" class="editor-button" id="showDescriptionEditorBtn">Show Editor</button>
                            </div>
                        </div>
                        
                        <!-- Right Panel - Classifications -->
                        <div class="form-section">
                            <h3 class="section-title classifications">CLASSIFICATIONS</h3>
                            
                            <div class="form-group">
                                <h4 class="section-title">BASIC CLASSIFICATIONS</h4>
                                <label class="form-label">
                                    BUDG Status
                                    <span class="required">*</span>
                                </label>
                                <select class="form-select" id="budgStatusSelect">
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                    <option value="discontinued">Discontinued</option>
                                    <option value="under-development">Under Development</option>
                                    <option value="retired">Retired</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    BUDG Viewing
                                    <span class="required">*</span>
                                </label>
                                <select class="form-select" id="budgViewingSelect">
                                    <option value="public">Public</option>
                                    <option value="private">Private</option>
                                    <option value="restricted">Restricted</option>
                                    <option value="confidential">Confidential</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    Lifecycle
                                    <span class="required">*</span>
                                </label>
                                <select class="form-select" id="lifecycleSelect">
                                    <option value="in-effect">In Effect</option>
                                    <option value="planning">Planning</option>
                                    <option value="development">Development</option>
                                    <option value="testing">Testing</option>
                                    <option value="beta">Beta</option>
                                    <option value="end-of-life">End of Life</option>
                                    <option value="sunset">Sunset</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <h4 class="section-title">OTHER INFORMATION</h4>
                                <label class="form-label">
                                    Classification
                                    <span class="required">*</span>
                                </label>
                                <select class="form-select" id="classificationSelect">
                                    <option value="organisational-capability">Organisational Capability</option>
                                    <option value="business-capability">Business Capability</option>
                                    <option value="technical-capability">Technical Capability</option>
                                    <option value="operational-capability">Operational Capability</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">
                                    Capability Type
                                    <span class="required">*</span>
                                </label>
                                <select class="form-select" id="capabilityTypeSelect">
                                    <option value="capability">Capability</option>
                                    <option value="sub-capability">Sub-Capability</option>
                                    <option value="core-capability">Core Capability</option>
                                    <option value="supporting-capability">Supporting Capability</option>
                                </select>
                            </div>
                            
                            <!-- Segment Field -->
                            <div id="segmentFieldContainer" style="grid-column: 1/-1; margin-top: 1rem;"></div>
                        </div>

                        <!-- Custom Fields Card -->
                        <div class="form-section" id="customFieldsSection">
                            <h3 class="section-title optional-fields">CUSTOM FIELDS</h3>
                            <div id="customFieldsContainer"></div>
                        </div>
                    </div>
                    
                </form>
            </div>
        </div>
    </main>

    <!-- Parent Selection Modal -->
    <div class="modal-overlay" id="parentModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Current selection: <span id="currentSelection">None</span></div>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-search">
                    <div class="search-input-container">
                        <input type="text" class="modal-search-input" id="searchInput" placeholder="Search by name or description...">
                        <button type="button" class="search-clear-btn" id="searchClearBtn" title="Clear search">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="modal-table-container">
                    <table class="modal-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Table data will be populated dynamically from API -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-service.js"></script>
    <script src="assets/js/admin-panel/admin-notifications.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/initSearch.js"></script>
    <script src="assets/js/global-lock-ui.js"></script>

    <script src="assets/js/custom-fields.js"></script>
    <script src="assets/js/segment-field.js"></script>
    <script src="assets/js/advanced-rich-text-editor.js"></script>
    <script src="assets/js/capability.js"></script>
    <script src="assets/js/header.js"></script>
</body>
</html>
