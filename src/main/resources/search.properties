# Unified Search Configuration

# Limits
search.limits.max-results-per-facet=50
search.limits.max-total-results=200
search.limits.timeout-ms=5000

# Cache
search.cache.enabled=true
search.cache.ttl-minutes=5
search.cache.dynamic-ttl-minutes=1

# Dedup
search.dedup.strategy=BOTH

# Active Tasks
search.active-tasks.include-workflow-tasks=true
search.active-tasks.include-direct-tasks=true
search.active-tasks.max-tasks-per-object=10

# Performance
search.performance.batch-size=100
search.performance.enable-query-caching=true

# Security
search.security.enable-permission-checking=true
search.security.default-visibility=PUBLIC

