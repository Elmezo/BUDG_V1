version: "2"
type: backend
tech_stack:
  - Java 17
  - Jakarta Servlet (Tomcat)
  - JDBC / SQL
  - Gson JSON
features:
  - name: Unison composite search API
    description: Primary search for search.html; compound FIND/AND/OR/NOT across facets; returns FacetResult map and execution metadata.
    files:
      - src/main/java/com/example/unisonsearch/servlet/UnisonSearchApiServlet.java
      - src/main/java/com/example/unisonsearch/service/UnisonSearchService.java
      - src/main/java/com/example/unisonsearch/model/UnisonSearchRequest.java
      - src/main/java/com/example/unisonsearch/model/UnisonSearchResponse.java
    endpoints:
      - method: POST
        path: /api/unison/search
        description: Execute Unison search with JSON body searches[] and options maxDepth includeCounts
        auth_required: false
        request_schema:
          body:
            searches: array
            options: object
        response_schema:
          "200": UnisonSearchResponse JSON
          "400": empty or invalid searches
      - method: GET
        path: /api/unison/search
        description: Method not allowed; instructs client to use POST
        auth_required: false
        response_schema:
          "405": JSON message
  - name: Unison facet configuration API
    description: User facet tabs layout and SuperAdmin defaults under /api/unison/*
    files:
      - src/main/java/com/example/unisonsearch/servlet/UnisonFacetServlet.java
    endpoints:
      - method: GET
        path: /api/unison/facets
        description: Get facet layout for current user
        auth_required: true
        response_schema:
          "200": facets JSON
      - method: POST
        path: /api/unison/facets/save
        description: Save facet tab layout
        auth_required: true
      - method: POST
        path: /api/unison/facets/reset
        description: Reset facets to default
        auth_required: true
  - name: Search filter metadata (UnisonSearch UI)
    description: Filter panel field definitions and value lists for each facet
    files:
      - src/main/java/com/example/unisonsearch/servlet/FilterFieldsServlet.java
      - src/main/java/com/example/unisonsearch/servlet/FilterValuesServlet.java
    endpoints:
      - method: GET
        path: /UnisonSearch/api/filter-fields
        description: List filterable fields for facetId query param
        auth_required: false
        response_schema:
          "400": missing facetId
      - method: GET
        path: /UnisonSearch/api/filter-values/*
        description: Possible values for a filter field
        auth_required: false
  - name: People autocomplete for filters
    files:
      - src/main/java/com/example/unisonsearch/servlet/PeopleSearchServlet.java
    endpoints:
      - method: GET
        path: /UnisonSearch/api/people/search
        description: Autocomplete people for filter rows query and limit params
        auth_required: false
  - name: UNISON grid defaults columns
    files:
      - src/main/java/com/example/unisonsearch/servlet/UnisonDefaultsServlet.java
    endpoints:
      - method: GET
        path: /UnisonSearch/api/defaults
        description: Default column config for Unison results grid
        auth_required: false
  - name: Unified object-scoped search (alternate)
    files:
      - src/main/java/com/example/unisonsearch/servlet/UnifiedSearchApiServlet.java
    endpoints:
      - method: POST
        path: /api/unified/search
        description: Alternative unified search with SearchRequest body
        auth_required: true
    depends_on:
      - Authentication session or token for protected routes
known_limitations:
  - issue: TestSprite cloud agents cannot reach developer localhost unless tunneling is configured
    location: MCP TestSprite execution environment
    impact: Remote runs may report server unreachable while local curl succeeds
